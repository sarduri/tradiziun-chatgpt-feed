name: ChatGPT-Produktfeed

on:
  schedule:
    - cron: "30 21 * * *"   # täglich ca. 22:30/23:30 Schweizer Zeit, vor dem Abruf des Business Hub (ca. 01:00)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feed erzeugen
        run: |
          mkdir -p public
          python3 tools/chatgpt_feed.py --base-url https://tradiziun.ch -o public/feed.jsonl.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
